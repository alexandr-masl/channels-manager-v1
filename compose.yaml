# Isolated local stack; production dependencies already exist in Kubernetes.
services:
  satoshi-channel-updates-manager:
    image: kolobobolobo/satoshi-channels-updates:latest
    build: .
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      RABBIT_MQ: amqp://guest:guest@rabbitmq:5672/%2f
      MONGO_PATH: mongodb://mongo-tg-client/MyBot
      TRADE_STATION_MONGO_PATH: mongodb://mongo/MCR_trading_api
      ACCOUNT_VALIDATOR_MONGO_PATH: mongodb://mongo-account-validator/McrAccValidator
      REDIS: redis
      REDIS_CLIENT_PORT: "6379"
      TELEGRAM_INTAKE_ENABLED: "true"
      CLIENT_TRADE_WORKER_PREFETCH: "2"
      STATIC_LOW_BALANCE_FALLBACK_RATIO_FUTURES: "0.95"
      CLIENT_TRADE_WORKER_QUEUES: satoshi-channel-updates.client-trade.bingx.futures
      SERVICE_REVISION: channels-manager-v1
    depends_on:
      - rabbitmq
      - redis
      - mongo-tg-client
      - mongo
      - mongo-account-validator
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
  redis:
    image: redis:7-bookworm
  mongo-tg-client:
    image: mongo:8.0
    volumes:
      - bot-data:/data/db
  mongo:
    image: mongo:8.0
    volumes:
      - trade-data:/data/db
  mongo-account-validator:
    image: mongo:8.0
    volumes:
      - account-data:/data/db
volumes:
  bot-data:
  trade-data:
  account-data:
