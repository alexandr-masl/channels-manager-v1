[package]
name = "channels-manager-v1"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
