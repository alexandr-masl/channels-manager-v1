[package]
name = "channels-manager-v1"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
# Preserve panic unwinding and task failure handling.
panic = "unwind"

[dependencies]
async-compat = "0.2.6"
dotenvy = "0.15.7"
futures-util = "0.3.34"
lapin = { version = "4.11.0", default-features = false, features = ["tokio", "rustls--ring", "rustls-native-certs"] }
mongodb = "3.9.1"
rand = "0.9"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
