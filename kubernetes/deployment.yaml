apiVersion: apps/v1
kind: Deployment
metadata:
  name: satoshi-channel-updates-manager
  labels:
    io.kompose.service: satoshi-channel-updates-manager
spec:
  replicas: 2
  # Stop the old consumer pods before starting the replacement implementation.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      io.kompose.service: satoshi-channel-updates-manager
  template:
    metadata:
      labels:
        io.kompose.service: satoshi-channel-updates-manager
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 65532
      volumes:
        - name: application-authorization
          secret:
            secretName: channels-manager-authorization
            optional: true
            defaultMode: 0440
            items:
              - key: authorization.json
                path: authorization.json
      containers:
        - name: satoshi-channel-updates-manager
          image: kolobobolobo/satoshi-channels-updates:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: application-authorization
              mountPath: /run/authorization
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Clear the TypeScript HTTP probes when updating the existing resource.
          startupProbe: null
          readinessProbe: null
          livenessProbe: null
          env:
            # For worker-only cutover, disable Telegram intake and retain it
            # in another workload. Client-job publication/worker are always active.
            - name: TELEGRAM_INTAKE_ENABLED
              value: "true"
            - name: SATOSHI_TG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcr-tg-client-secrets
                  key: SATOSHI_TG_TOKEN
            - name: CLIENT_TRADE_WORKER_PREFETCH
              value: "2"
            - name: STATIC_LOW_BALANCE_FALLBACK_RATIO_FUTURES
              value: "0.95"
            - name: MONGO_PATH
              value: mongodb://mongo-tg-client/MyBot
            - name: TRADE_STATION_MONGO_PATH
              value: mongodb://mongo/MCR_trading_api
            - name: ACCOUNT_VALIDATOR_MONGO_PATH
              value: mongodb://mongo-account-validator/McrAccValidator
            - name: RABBIT_MQ
              value: amqp://guest:guest@rabbitmq
            - name: REDIS
              value: redis
            - name: REDIS_CLIENT_PORT
              value: "6379"
            - name: CLIENT_TRADE_WORKER_QUEUES
              value: satoshi-channel-updates.client-trade.bingx.futures
            - name: CONSUMER_PREFETCH
              value: "6"
            - name: SHUTDOWN_DRAIN_TIMEOUT_MS
              value: "10000"
            - name: SHUTDOWN_TIMEOUT_MS
              value: "30000"
            - name: SERVICE_REVISION
              value: channels-manager-v1
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
