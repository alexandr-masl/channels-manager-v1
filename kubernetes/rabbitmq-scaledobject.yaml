# Apply only where KEDA is installed. Replaces the original ScaledObject by name.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: satoshi-channel-updates-manager-rabbitmq
spec:
  scaleTargetRef:
    name: satoshi-channel-updates-manager
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: rabbitmq
      metadata:
        hostFromEnv: RABBIT_MQ
        queueName: tg_bot_channel_update
        mode: QueueLength
        value: "5"
